eyebrow: Nuestra historia
titulo: Un lugar de reencuentro y conexión con nuestras raíces
texto: >-
  Hace mucho tiempo, en un lugar escondido de la memoria, nació un sueño, y esa
  semilla quedó guardada hasta que encontró agua... tierra... luz... aire... en
  donde se pudiera arraigar. Al unir estos cuatro elementos nació Verderapia.
